name: Semantic Release with Enhanced Notes

on:
  push:
    branches:
      - staging
      - production
permissions:
  contents: write
jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version_type: ${{ steps.commit-analysis.outputs.version_type }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Analyze commit messages
        id: commit-analysis
        run: |
          # Check all commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          
          if [ "$LAST_TAG" = "none" ]; then
            # No previous tags, this is the first release
            echo "version_type=minor" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Check commit messages for semantic version keywords
          COMMITS=$(git log $LAST_TAG..HEAD --pretty=format:"%s")
          
          # Check for breaking changes (MAJOR)
          if echo "$COMMITS" | grep -q -i "BREAKING CHANGE\|BREAKING-CHANGE\|breaking change"; then
            echo "version_type=major" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Check for feat: (MINOR)
          if echo "$COMMITS" | grep -q -i "^feat\|^feature\|^feat:"; then
            echo "version_type=minor" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Default to patch
          echo "version_type=patch" >> $GITHUB_OUTPUT

  create-release:
    needs: determine-version
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Setup Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
      - name: Get current branch
        id: branch
        run: echo "name=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT
        
      - name: Create tag and generate release notes
        id: create-tag
        run: |
          # Get the latest version
          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" | sort -V | tail -n 1 || echo "v0.0.0")
          
          # Remove 'v' prefix for calculation
          VERSION_NUM=${LATEST_TAG#v}
          
          # Split version into components
          MAJOR=$(echo $VERSION_NUM | cut -d. -f1)
          MINOR=$(echo $VERSION_NUM | cut -d. -f2)
          PATCH=$(echo $VERSION_NUM | cut -d. -f3)
          
          # Bump version based on commit analysis
          case "${{ needs.determine-version.outputs.version_type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="v$MAJOR.$MINOR.$PATCH"
          
          # Create tag based on branch
          if [ "${{ steps.branch.outputs.name }}" = "staging" ]; then
            # For staging, create a release candidate
            RC_COUNT=$(git tag -l "$NEW_VERSION-rc.*" | wc -l)
            RC_COUNT=$((RC_COUNT + 1))
            TAG_VERSION="$NEW_VERSION-rc.$RC_COUNT"
            
            git tag -a "$TAG_VERSION" -m "Release candidate $RC_COUNT for $NEW_VERSION"
            echo "Created release candidate tag: $TAG_VERSION"
            echo "tag_name=$TAG_VERSION" >> $GITHUB_OUTPUT
            
            # Generate enhanced release notes for RC
            echo "release_notes<<EOF" >> $GITHUB_OUTPUT
            echo "# Release Candidate $RC_COUNT for $NEW_VERSION" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "## Commits included in this release candidate:" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            
            # Get all commits since the last RC or release
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -z "$PREV_TAG" ]; then
              # List all commits if no previous tag
              git log --pretty=format:"* %s (%h) - %an, %ar" >> $GITHUB_OUTPUT
            else
              # List commits since the last tag
              git log $PREV_TAG..HEAD --pretty=format:"* %s (%h) - %an, %ar" >> $GITHUB_OUTPUT
            fi
            
            echo "EOF" >> $GITHUB_OUTPUT
          else
            # For production, create the final version
            git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
            echo "Created release tag: $NEW_VERSION"
            echo "tag_name=$NEW_VERSION" >> $GITHUB_OUTPUT
            
            # Generate detailed release notes for production
            echo "Generating release notes for $NEW_VERSION..."
            
            # Find previous production release tag
            PREV_PROD_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" | grep -v "rc" | sort -V | tail -n 2 | head -n 1)
            
            # Start building release notes
            echo "release_notes<<EOF" >> $GITHUB_OUTPUT
            echo "# Release $NEW_VERSION" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            
            # Add summary of changes
            echo "## Summary" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            
            # Count changes by type
            if [ -z "$PREV_PROD_TAG" ]; then
              # If this is the first production release, count all commits
              FEAT_COUNT=$(git log --pretty=format:"%s" | grep -i "^feat" | wc -l)
              FIX_COUNT=$(git log --pretty=format:"%s" | grep -i "^fix" | wc -l)
              TOTAL_COMMITS=$(git log --pretty=format:"%s" | wc -l)
            else
              # Count commits since previous production release
              FEAT_COUNT=$(git log $PREV_PROD_TAG..HEAD --pretty=format:"%s" | grep -i "^feat" | wc -l)
              FIX_COUNT=$(git log $PREV_PROD_TAG..HEAD --pretty=format:"%s" | grep -i "^fix" | wc -l)
              TOTAL_COMMITS=$(git log $PREV_PROD_TAG..HEAD --pretty=format:"%s" | wc -l)
            fi
            
            OTHER_COUNT=$((TOTAL_COMMITS - FEAT_COUNT - FIX_COUNT))
            
            echo "This release includes $FEAT_COUNT new features, $FIX_COUNT bug fixes, and $OTHER_COUNT other changes." >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            
            # Get detailed commit information
            if [ -z "$PREV_PROD_TAG" ]; then
              # For first release
              
              # Features section with author and date
              if [ $FEAT_COUNT -gt 0 ]; then
                echo "## New Features" >> $GITHUB_OUTPUT
                echo "" >> $GITHUB_OUTPUT
                git log --pretty=format:"* %s (%h) - %an, %ar" | grep -i "^feat" >> $GITHUB_OUTPUT
                echo "" >> $GITHUB_OUTPUT
                echo "" >> $GITHUB_OUTPUT
              fi
              
              # Fixes section with author and date
              if [ $FIX_COUNT -gt 0 ]; then
                echo "## Bug Fixes" >> $GITHUB_OUTPUT
                echo "" >> $GITHUB_OUTPUT
                git log --pretty=format:"* %s (%h) - %an, %ar" | grep -i "^fix" >> $GITHUB_OUTPUT
                echo "" >> $GITHUB_OUTPUT
                echo "" >> $GITHUB_OUTPUT
              fi
              
              # Other changes section with author and date
              if [ $OTHER_COUNT -gt 0 ]; then
                echo "## Other Changes" >> $GITHUB_OUTPUT
                echo "" >> $GITHUB_OUTPUT
                git log --pretty=format:"* %s (%h) - %an, %ar" | grep -i -v "^feat\|^fix" >> $GITHUB_OUTPUT
                echo "" >> $GITHUB_OUTPUT
              fi
            else
              # For subsequent releases
              
              # Features section with author and date
              if [ $FEAT_COUNT -gt 0 ]; then
                echo "## New Features" >> $GITHUB_OUTPUT
                echo "" >> $GITHUB_OUTPUT
                git log $PREV_PROD_TAG..HEAD --pretty=format:"* %s (%h) - %an, %ar" | grep -i "^feat" >> $GITHUB_OUTPUT
                echo "" >> $GITHUB_OUTPUT
                echo "" >> $GITHUB_OUTPUT
              fi
              
              # Fixes section with author and date
              if [ $FIX_COUNT -gt 0 ]; then
                echo "## Bug Fixes" >> $GITHUB_OUTPUT
                echo "" >> $GITHUB_OUTPUT
                git log $PREV_PROD_TAG..HEAD --pretty=format:"* %s (%h) - %an, %ar" | grep -i "^fix" >> $GITHUB_OUTPUT
                echo "" >> $GITHUB_OUTPUT
                echo "" >> $GITHUB_OUTPUT
              fi
              
              # Other changes section with author and date
              if [ $OTHER_COUNT -gt 0 ]; then
                echo "## Other Changes" >> $GITHUB_OUTPUT
                echo "" >> $GITHUB_OUTPUT
                git log $PREV_PROD_TAG..HEAD --pretty=format:"* %s (%h) - %an, %ar" | grep -i -v "^feat\|^fix" >> $GITHUB_OUTPUT
                echo "" >> $GITHUB_OUTPUT
              fi
            fi
            
            # Add links to compare changes between versions
            if [ ! -z "$PREV_PROD_TAG" ]; then
              REPO_URL=$(git config --get remote.origin.url | sed 's/\.git$//' | sed 's/git@github\.com:/https:\/\/github.com\//')
              echo "## Compare Changes" >> $GITHUB_OUTPUT
              echo "" >> $GITHUB_OUTPUT
              echo "View all changes between $PREV_PROD_TAG and $NEW_VERSION: $REPO_URL/compare/$PREV_PROD_TAG...$NEW_VERSION" >> $GITHUB_OUTPUT
              echo "" >> $GITHUB_OUTPUT
            fi
            
            echo "EOF" >> $GITHUB_OUTPUT
          fi
          
          git push --tags
          
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.create-tag.outputs.tag_name }}
          release_name: Release ${{ steps.create-tag.outputs.tag_name }}
          body: ${{ steps.create-tag.outputs.release_notes }}
          draft: false
          prerelease: ${{ steps.branch.outputs.name == 'staging' }}
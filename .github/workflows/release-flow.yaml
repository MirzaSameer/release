name: Semantic Release with Notes

on:
  push:
    branches:
      - staging
      - production
permissions:
  contents: write

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version_type: ${{ steps.commit-analysis.outputs.version_type }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Analyze commit messages
        id: commit-analysis
        run: |
          # Check all commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          
          if [ "$LAST_TAG" = "none" ]; then
            # No previous tags, this is the first release
            echo "version_type=minor" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Check commit messages for semantic version keywords
          COMMITS=$(git log $LAST_TAG..HEAD --pretty=format:"%s")
          
          # Check for breaking changes (MAJOR)
          if echo "$COMMITS" | grep -q -i "BREAKING CHANGE\|BREAKING-CHANGE\|breaking change"; then
            echo "version_type=major" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Check for feat: (MINOR)
          if echo "$COMMITS" | grep -q -i "^feat\|^feature\|^feat:"; then
            echo "version_type=minor" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Default to patch
          echo "version_type=patch" >> $GITHUB_OUTPUT

  create-release:
    needs: determine-version
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Setup Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
      - name: Get current branch
        id: branch
        run: echo "name=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT
        
      - name: Create tag
        id: create-tag
        run: |
          # Get the latest version
          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" | sort -V | tail -n 1 || echo "v0.0.0")
          
          # Remove 'v' prefix for calculation
          VERSION_NUM=${LATEST_TAG#v}
          
          # Split version into components
          MAJOR=$(echo $VERSION_NUM | cut -d. -f1)
          MINOR=$(echo $VERSION_NUM | cut -d. -f2)
          PATCH=$(echo $VERSION_NUM | cut -d. -f3)
          
          # Bump version based on commit analysis
          case "${{ needs.determine-version.outputs.version_type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="v$MAJOR.$MINOR.$PATCH"
          
          # Create tag based on branch
          if [ "${{ steps.branch.outputs.name }}" = "staging" ]; then
            # For staging, create a release candidate
            RC_COUNT=$(git tag -l "$NEW_VERSION-rc.*" | wc -l)
            RC_COUNT=$((RC_COUNT + 1))
            TAG_VERSION="$NEW_VERSION-rc.$RC_COUNT"
            
            git tag -a "$TAG_VERSION" -m "Release candidate $RC_COUNT for $NEW_VERSION"
            echo "Created release candidate tag: $TAG_VERSION"
            echo "tag_name=$TAG_VERSION" >> $GITHUB_OUTPUT
          else
            # For production, create the final version
            git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
            echo "Created release tag: $NEW_VERSION"
            echo "tag_name=$NEW_VERSION" >> $GITHUB_OUTPUT
          fi
          
          git push --tags

      - name: Generate Release Notes
        id: release-notes
        if: ${{ steps.branch.outputs.name == 'production' }}
        run: |
          # Find previous production release tag
          PREV_PROD_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" | grep -v "rc" | sort -V | tail -n 2 | head -n 1 || echo "")
          
          if [ -z "$PREV_PROD_TAG" ]; then
            # If this is the first production release
            echo "### What's New" > notes.md
            
            # Get all commits and format them by type
            git log --pretty=format:"- %s (%h)" | grep -i "^feat" > feat_commits.txt
            git log --pretty=format:"- %s (%h)" | grep -i "^fix" > fix_commits.txt
            git log --pretty=format:"- %s (%h)" | grep -i -v "^feat\|^fix" > other_commits.txt
          else
            # Get changes between previous production release and now
            echo "### What's New" > notes.md
            
            # Get commits by type
            git log $PREV_PROD_TAG..HEAD --pretty=format:"- %s (%h)" | grep -i "^feat" > feat_commits.txt || true
            git log $PREV_PROD_TAG..HEAD --pretty=format:"- %s (%h)" | grep -i "^fix" > fix_commits.txt || true
            git log $PREV_PROD_TAG..HEAD --pretty=format:"- %s (%h)" | grep -i -v "^feat\|^fix" > other_commits.txt || true
          fi
          
          # Build the release notes
          if [ -s feat_commits.txt ]; then
            echo -e "\n#### New Features\n" >> notes.md
            cat feat_commits.txt >> notes.md
          fi
          
          if [ -s fix_commits.txt ]; then
            echo -e "\n#### Bug Fixes\n" >> notes.md
            cat fix_commits.txt >> notes.md
          fi
          
          if [ -s other_commits.txt ]; then
            echo -e "\n#### Other Changes\n" >> notes.md
            cat other_commits.txt >> notes.md
          fi
          
          echo "release_notes=$(cat notes.md)" >> $GITHUB_ENV

      - name: Create GitHub Release for Production
        if: ${{ steps.branch.outputs.name == 'production' }}
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.create-tag.outputs.tag_name }}
          release_name: Release ${{ steps.create-tag.outputs.tag_name }}
          body_path: notes.md
          draft: false
          prerelease: false
          
      - name: Create GitHub Release for Staging
        if: ${{ steps.branch.outputs.name == 'staging' }}
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.create-tag.outputs.tag_name }}
          release_name: Release ${{ steps.create-tag.outputs.tag_name }}
          body: "Release candidate for testing"
          draft: false
          prerelease: true

name: Semantic Release with Notes

on:
  push:
    branches:
      - production

permissions:
  contents: write

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version_type: ${{ steps.commit-analysis.outputs.version_type }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Analyze commit messages
        id: commit-analysis
        run: |
          # Check all commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          
          if [ "$LAST_TAG" = "none" ]; then
            # No previous tags, this is the first release
            echo "version_type=minor" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Check commit messages for semantic version keywords
          COMMITS=$(git log $LAST_TAG..HEAD --pretty=format:"%s")
          
          # Check for breaking changes (MAJOR)
          if echo "$COMMITS" | grep -q -i "BREAKING CHANGE\|BREAKING-CHANGE\|breaking change"; then
            echo "version_type=major" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Check for feat: (MINOR)
          if echo "$COMMITS" | grep -q -i "^feat\|^feature\|^feat:"; then
            echo "version_type=minor" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Default to patch
          echo "version_type=patch" >> $GITHUB_OUTPUT

  create-release:
    needs: determine-version
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Setup Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
      - name: Create tag and release for production
        run: |
          # Get the latest version
          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" | sort -V | tail -n 1 || echo "v0.0.0")
          
          # Remove 'v' prefix for calculation
          VERSION_NUM=${LATEST_TAG#v}
          
          # Split version into components
          MAJOR=$(echo $VERSION_NUM | cut -d. -f1)
          MINOR=$(echo $VERSION_NUM | cut -d. -f2)
          PATCH=$(echo $VERSION_NUM | cut -d. -f3)
          
          # Bump version based on commit analysis
          case "${{ needs.determine-version.outputs.version_type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="v$MAJOR.$MINOR.$PATCH"
          
          # Create final version tag
          git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
          echo "Created release tag: $NEW_VERSION"
          git push --tags
          
          # Generate detailed release notes
          PREV_PROD_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" | grep -v "rc" | sort -V | tail -n 2 | head -n 1 || echo "")
          
          if [ -z "$PREV_PROD_TAG" ]; then
            # If this is the first release
            FEAT_COMMITS=$(git log --pretty=format:"- %s (%h)" | grep -i "^feat" || echo "")
            FIX_COMMITS=$(git log --pretty=format:"- %s (%h)" | grep -i "^fix" || echo "")
            OTHER_COMMITS=$(git log --pretty=format:"- %s (%h)" | grep -i -v "^feat\|^fix" || echo "")
          else
            # Get changes since last production release
            FEAT_COMMITS=$(git log $PREV_PROD_TAG..HEAD --pretty=format:"- %s (%h)" | grep -i "^feat" || echo "")
            FIX_COMMITS=$(git log $PREV_PROD_TAG..HEAD --pretty=format:"- %s (%h)" | grep -i "^fix" || echo "")
            OTHER_COMMITS=$(git log $PREV_PROD_TAG..HEAD --pretty=format:"- %s (%h)" | grep -i -v "^feat\|^fix" || echo "")
          fi
          
          # Build the release notes
          RELEASE_NOTES="### Release $NEW_VERSION\n\n"
          
          if [ ! -z "$FEAT_COMMITS" ]; then
            RELEASE_NOTES="$RELEASE_NOTES#### New Features\n\n$FEAT_COMMITS\n\n"
          fi
          
          if [ ! -z "$FIX_COMMITS" ]; then
            RELEASE_NOTES="$RELEASE_NOTES#### Bug Fixes\n\n$FIX_COMMITS\n\n"
          fi
          
          if [ ! -z "$OTHER_COMMITS" ]; then
            RELEASE_NOTES="$RELEASE_NOTES#### Other Changes\n\n$OTHER_COMMITS\n\n"
          fi
          
          # Use the GitHub API to create a release with enhanced notes
          curl \
            -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d '{
              "tag_name": "'"$NEW_VERSION"'",
              "name": "Release '"$NEW_VERSION"'",
              "body": "'"${RELEASE_NOTES//$'\n'/\\n}"'",
              "draft": false,
              "prerelease": false
            }'